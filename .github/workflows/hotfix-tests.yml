name: Signature and Trio shortcuts (Windows)
on:
  push:
    paths:
      - 'QuickerKeys.ahk'
      - 'tests/hotfix-*'
      - 'tests/run-hotfix-tests.ps1'
      - '.github/workflows/hotfix-tests.yml'
  pull_request:
    paths:
      - 'QuickerKeys.ahk'
      - 'tests/hotfix-*'
      - 'tests/run-hotfix-tests.ps1'
      - '.github/workflows/hotfix-tests.yml'
permissions:
  contents: read
jobs:
  hotfix-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned AutoHotkey v2
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ahk.zip'
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.19/AutoHotkey_2.0.19.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '4E0D0E65655066A646A210951320FEAEF0729A3597177131ADAEC4066BEF5869') { throw 'AutoHotkey hash mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'ahk')
      - name: Parse full app and test signatures, hotstrings and duration selection
        shell: pwsh
        run: ./tests/run-hotfix-tests.ps1 -AutoHotkey "$env:RUNNER_TEMP/ahk/AutoHotkey64.exe"
